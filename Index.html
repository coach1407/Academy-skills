<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>أكاديمية سكيلز</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--green:#00c853;--green-glow:#00ff6a33;--gold:#ffd600;--red:#ff1744;--blue:#2979ff;--orange:#ff6d00;--bg:#050e08;--card:#0a1a0f;--card2:#0f2016;--border:#1a3a22;--text:#e8f5e9;--muted:#4a7a56;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Tajawal,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{text-align:center;padding:1.25rem 1rem 0.4rem;}
header h1{font-size:1.7rem;font-weight:900;color:var(--green);text-shadow:0 0 30px var(--green-glow);}
header p{color:var(--muted);font-size:0.82rem;margin-top:0.15rem;}
.main-tabs{display:flex;background:var(--card);border-bottom:2px solid var(--border);}
.main-tab{flex:1;padding:0.75rem 0.5rem;font-family:Tajawal,sans-serif;font-size:0.8rem;font-weight:700;border:none;background:transparent;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;}
.main-tab.active{color:var(--green);border-bottom-color:var(--green);}
.page{display:none;}.page.active{display:block;}
.sync-bar{display:flex;justify-content:center;align-items:center;gap:0.75rem;padding:0.5rem 1rem;background:var(--card);border-bottom:1px solid var(--border);}
.sync-status{font-size:0.73rem;padding:0.22rem 0.7rem;border-radius:20px;font-weight:700;}
.sync-ok{background:#00c85322;color:var(--green);border:1px solid #00c85344;}
.sync-err{background:#ff174422;color:var(--red);border:1px solid #ff174433;}
.sync-loading{background:#ffd60022;color:var(--gold);border:1px solid #ffd60033;}
@keyframes spin{to{transform:rotate(360deg);}}
.spinner{display:inline-block;width:11px;height:11px;border:2px solid #0003;border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.6;}}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;display:inline-block;margin-left:3px;}
input,select{font-family:Tajawal,sans-serif;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:0.55rem 0.7rem;font-size:0.88rem;outline:none;width:100%;}
input:focus,select:focus{border-color:var(--green);}
input::placeholder{color:var(--muted);}
select option{background:#0a1a0f;}
.btn{font-family:Tajawal,sans-serif;font-weight:700;padding:0.55rem 1.1rem;border:none;border-radius:8px;cursor:pointer;font-size:0.88rem;}
.btn-green{background:var(--green);color:#000;}
.btn-gold{background:var(--gold);color:#000;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-red{background:#ff174422;color:var(--red);border:1px solid #ff174433;}
.btn-sm{padding:0.28rem 0.65rem;font-size:0.76rem;border-radius:6px;}
.btn-orange{background:#ff6d0022;color:#ff6d00;border:1px solid #ff6d0033;}
.btn-purple{background:#6a1b9a22;color:#ce93d8;border:1px solid #6a1b9a33;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-bottom:0.5rem;}
.form-full{grid-column:1/-1;}
label{font-size:0.76rem;color:var(--muted);margin-bottom:0.18rem;display:block;}
.section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0.9rem;margin-bottom:0.9rem;}
.section-title{color:var(--green);font-size:0.92rem;font-weight:800;margin-bottom:0.7rem;}
.save-row{display:flex;justify-content:center;padding:0.7rem 1rem 1rem;}
.sub-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--card);}
.sub-tab{flex:1;padding:0.6rem 0.4rem;font-family:Tajawal,sans-serif;font-size:0.78rem;font-weight:700;border:none;background:transparent;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.sub-tab.active{color:var(--green);border-bottom-color:var(--green);}
.sub-page{display:none;padding:0.9rem;}.sub-page.active{display:block;}
.player-sub-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:0.65rem;overflow:hidden;}
.player-sub-header{display:flex;align-items:center;padding:0.65rem 0.9rem;gap:0.65rem;cursor:pointer;}
.jersey{width:32px;height:32px;border-radius:8px;background:var(--green);color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.82rem;flex-shrink:0;}
.player-sub-name{flex:1;font-weight:800;font-size:0.88rem;}
.sub-badge{font-size:0.68rem;padding:0.18rem 0.45rem;border-radius:20px;font-weight:700;}
.sub-active{background:#00c85322;color:var(--green);border:1px solid #00c85344;}
.sub-expired{background:#ff174422;color:var(--red);border:1px solid #ff174433;}
.sub-stopped{background:#ff6d0022;color:#ff6d00;border:1px solid #ff6d0033;}
.sub-expiring{background:#ffd60022;color:var(--gold);border:1px solid #ffd60033;}
.player-sub-body{display:none;padding:0 0.9rem 0.9rem;flex-direction:column;gap:0.4rem;}
.player-sub-body.open{display:flex;}
.info-row{display:flex;justify-content:space-between;align-items:center;font-size:0.8rem;}
.info-label{color:var(--muted);}
.info-val{font-weight:700;}
.sub-actions{display:flex;gap:0.35rem;flex-wrap:wrap;margin-top:0.25rem;}
.att-row{display:flex;align-items:center;padding:0.55rem 0.9rem;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:0.4rem;gap:0.65rem;}
.att-name{flex:1;font-weight:700;font-size:0.85rem;}
.att-btns{display:flex;gap:0.35rem;}
.att-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--card2);font-size:0.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.att-btn.present{background:#00c85322;border-color:var(--green);}
.att-btn.absent{background:#ff174422;border-color:var(--red);}
.week-bar{display:flex;justify-content:center;align-items:center;gap:0.65rem;padding:0.65rem 1rem;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.wk-btn{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:0.22rem 0.6rem;cursor:pointer;font-size:0.95rem;font-family:Tajawal,sans-serif;}
.tabs{display:flex;overflow-x:auto;border-bottom:2px solid var(--border);background:var(--card);}
.tab{padding:0.6rem 0.9rem;font-family:Tajawal,sans-serif;font-size:0.8rem;font-weight:700;border:none;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px;}
.tab.active{color:var(--green);border-bottom-color:var(--green);}
.tab-content{display:none;padding:0.9rem;}.tab-content.active{display:block;}
.day-pill{padding:0.3rem 0.8rem;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-family:Tajawal,sans-serif;font-size:0.78rem;font-weight:600;}
.day-pill.active{background:var(--green);color:#000;border-color:var(--green);}
.rating-day-select{display:flex;gap:0.35rem;margin-bottom:0.9rem;flex-wrap:wrap;}
.group-filter{display:flex;gap:0.35rem;margin-bottom:0.7rem;flex-wrap:wrap;}
.player-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:0.55rem;}
.player-header{display:flex;align-items:center;padding:0.6rem 0.85rem;gap:0.6rem;cursor:pointer;}
.player-pos{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:800;flex-shrink:0;}
.pos-gk{background:#ff6d0022;color:#ff6d00;border:1px solid #ff6d0033;}
.pos-def,.pos-rb,.pos-lb{background:#1565c022;color:#42a5f5;border:1px solid #1565c033;}
.pos-mid{background:#6a1b9a22;color:#ce93d8;border:1px solid #6a1b9a33;}
.pos-fwd{background:#b71c1c22;color:#ef5350;border:1px solid #b71c1c33;}
.pos-rw,.pos-lw{background:#e6510022;color:#ffcc80;border:1px solid #e6510033;}
.player-name{font-weight:800;font-size:0.88rem;flex:1;}
.player-total{font-size:1.15rem;font-weight:900;color:var(--green);}
.player-total.zero{color:var(--muted);}
.criteria-grid{display:none;padding:0 0.85rem 0.85rem;gap:0.35rem;flex-direction:column;}
.criteria-grid.open{display:flex;}
.criteria-row{display:flex;align-items:center;justify-content:space-between;gap:0.35rem;}
.criteria-label{font-size:0.78rem;color:var(--muted);flex:1;}
.score-btns{display:flex;gap:2px;}
.score-btn{width:25px;height:25px;border-radius:5px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-weight:700;font-size:0.73rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:Tajawal,sans-serif;}
.score-btn.selected{background:var(--green);color:#000;border-color:var(--green);}
.bonus-section{border-top:1px solid var(--border);margin-top:0.35rem;padding-top:0.35rem;}
.bonus-label{font-size:0.73rem;color:var(--gold);margin-bottom:0.25rem;font-weight:700;}
.bonus-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.22rem;}
.bonus-name{font-size:0.76rem;color:var(--muted);}
.counter-btns{display:flex;align-items:center;gap:0.3rem;}
.counter-btn{width:23px;height:23px;border-radius:5px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:0.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:Tajawal,sans-serif;}
.counter-val{font-weight:800;font-size:0.82rem;min-width:16px;text-align:center;color:var(--gold);}
.board-section{margin-bottom:1.1rem;}
.board-title{font-size:0.8rem;font-weight:800;color:var(--muted);margin-bottom:0.55rem;}
.board-row{display:flex;align-items:center;padding:0.5rem 0.85rem;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:0.3rem;gap:0.6rem;}
.board-row:first-child{border-color:#ffd60044;background:#ffd60008;}
.board-row:nth-child(2){border-color:#b0bec544;}
.board-row:nth-child(3){border-color:#ff6d0044;}
.rank{font-size:0.88rem;font-weight:900;min-width:24px;text-align:center;}
.rank-1{color:var(--gold);}.rank-2{color:#b0bec5;}.rank-3{color:#ff6d00;}
.board-name{flex:1;font-weight:700;font-size:0.83rem;}
.board-pts{font-weight:900;font-size:0.92rem;color:var(--green);}
.board-pts.top{color:var(--gold);}
.empty-msg{text-align:center;color:var(--muted);font-size:0.83rem;padding:1.5rem;}
.chevron{transition:transform 0.2s;color:var(--muted);font-size:0.73rem;}
.chevron.open{transform:rotate(180deg);}
.danger-zone{background:#1a0a0a;border:1px solid #3a1a1a;border-radius:12px;padding:0.9rem;margin-top:0.9rem;}
.danger-zone h3{color:var(--red);font-size:0.8rem;margin-bottom:0.35rem;}
.danger-zone p{color:var(--muted);font-size:0.73rem;margin-bottom:0.55rem;}
.modal-overlay{display:none;position:fixed;inset:0;background:#000a;z-index:100;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.4rem;max-width:340px;width:92%;text-align:center;max-height:90vh;overflow-y:auto;}
.modal h3{color:var(--green);margin-bottom:0.7rem;font-size:1rem;}
.modal p{color:var(--muted);font-size:0.83rem;margin-bottom:0.9rem;line-height:1.6;}
.modal-btns{display:flex;gap:0.45rem;justify-content:center;flex-wrap:wrap;}
.modal-body{text-align:right;margin-bottom:0.9rem;}
.modal-body label{font-size:0.78rem;color:var(--muted);margin-bottom:0.2rem;display:block;}
.modal-body input,.modal-body select{margin-bottom:0.5rem;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.6rem;margin-bottom:0.9rem;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0.65rem;text-align:center;}
.stat-num{font-size:1.5rem;font-weight:900;color:var(--green);}
.stat-num.gold{color:var(--gold);}
.att-summary-row{display:flex;align-items:center;padding:0.5rem 0.85rem;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:0.35rem;gap:0.6rem;}
.search-box{margin-bottom:0.7rem;}
.filter-row{display:flex;gap:0.35rem;margin-bottom:0.7rem;flex-wrap:wrap;}
</style>
</head>
<body>
<header>
  <h1>⚽ أكاديمية سكيلز</h1>
  <p>نظام إدارة الأكاديمية <span class="live-dot"></span></p>
</header>
<div class="sync-bar">
  <span id="syncStatus" class="sync-status sync-loading">جاري التحميل... <span class="spinner"></span></span>
  <button class="btn btn-gold btn-sm" onclick="saveAll()" id="saveBtn">☁️ حفظ</button>
</div>
<div class="main-tabs">
  <button class="main-tab active" onclick="switchMain('rating',this)">📊 التقييم</button>
  <button class="main-tab" onclick="switchMain('subscriptions',this)">💳 الاشتراكات</button>
  <button class="main-tab" onclick="switchMain('attendance',this)">✅ الحضور</button>
</div>

<!-- ===== RATING ===== -->

<div class="page active" id="page-rating">
  <div class="week-bar">
    <button class="wk-btn" onclick="changeWeek(-1)">‹</button>
    <strong id="weekLabel" style="color:var(--gold);font-size:0.88rem;">—</strong>
    <button class="wk-btn" onclick="changeWeek(1)">›</button>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('daily',this)">📋 اليومي</button>
    <button class="tab" onclick="switchTab('leaderboard',this)">🏆 المتصدرون</button>
    <button class="tab" onclick="switchTab('rplayers',this)">👥 اللاعبون</button>
  </div>
  <div class="tab-content active" id="tab-daily">
    <div class="group-filter">
      <button class="day-pill active" id="rg-all" onclick="setRatingGroup('all',this)">الكل</button>
      <button class="day-pill" id="rg-big" onclick="setRatingGroup('big',this)">🔵 الكبار</button>
      <button class="day-pill" id="rg-mid" onclick="setRatingGroup('mid',this)">🟡 الوسط</button>
      <button class="day-pill" id="rg-small" onclick="setRatingGroup('small',this)">🟢 الصغار</button>
    </div>
    <div class="rating-day-select" id="dayPills"></div>
    <div id="playerCards"></div>
    <div class="save-row"><button class="btn btn-gold" onclick="saveAll()">☁️ حفظ</button></div>
  </div>
  <div class="tab-content" id="tab-leaderboard"><div id="leaderboardContent"></div></div>
  <div class="tab-content" id="tab-rplayers">
    <div class="section">
      <div class="section-title">➕ إضافة لاعب للتقييم</div>
      <div class="form-grid">
        <div class="form-full">
          <label>تصفية حسب المجموعة</label>
          <select id="rAddGroup" onchange="refreshPlayerDropdown()">
            <option value="all">الكل</option>
            <option value="big">🔵 الكبار</option>
            <option value="mid">🟡 الوسط</option>
            <option value="small">🟢 الصغار</option>
          </select>
        </div>
        <div class="form-full" style="margin-top:0.5rem">
          <label>اختر اللاعب</label>
          <select id="rSelectPlayer">
            <option value="">-- اختر لاعباً --</option>
          </select>
        </div>
        <div class="form-full" style="margin-top:0.5rem">
          <label>المركز</label>
          <select id="rNewPos">
            <option value="fwd">⚡ مهاجم</option>
            <option value="rw">↗️ جناح أيمن</option>
            <option value="lw">↖️ جناح أيسر</option>
            <option value="mid">🔄 وسط</option>
            <option value="rb">🛡️ مدافع أيمن</option>
            <option value="lb">🛡️ مدافع أيسر</option>
            <option value="def">🛡️ مدافع</option>
            <option value="gk">🧤 حارس</option>
          </select>
        </div>
      </div>
      <button class="btn btn-green" onclick="addFromDropdown()" style="width:100%;margin-top:0.5rem">➕ إضافة للتقييم</button>
    </div>
    <div id="rPlayersList"></div>
    <div class="danger-zone">
      <h3>⚠️ منطقة الخطر</h3>
      <p>إعادة ضبط تقييمات الأسبوع الحالي</p>
      <button class="btn btn-red btn-sm" onclick="confirmResetWeek()">🗑️ إعادة ضبط</button>
    </div>
  </div>
</div>

<!-- ===== SUBSCRIPTIONS ===== -->

<div class="page" id="page-subscriptions">
  <div class="sub-tabs">
    <button class="sub-tab active" onclick="switchSub('list',this)">📋 اللاعبون</button>
    <button class="sub-tab" onclick="switchSub('add',this)">➕ إضافة</button>
    <button class="sub-tab" onclick="switchSub('alerts',this)">🔔 تنبيهات</button>
  </div>
  <div class="sub-page active" id="sub-list">
    <div class="search-box"><input id="subSearch" placeholder="🔍 بحث..." oninput="renderSubList()"/></div>
    <div class="filter-row">
      <button class="btn btn-sm" style="background:var(--card2);color:var(--text);border:1px solid var(--border)" onclick="filterSub('all')">الكل</button>
      <button class="btn btn-sm sub-active" onclick="filterSub('active')">✅ فعال</button>
      <button class="btn btn-sm sub-expired" onclick="filterSub('expired')">❌ منتهي</button>
      <button class="btn btn-sm sub-stopped" onclick="filterSub('stopped')">⏸ موقوف</button>
    </div>
    <div class="filter-row" id="subGroupFilterRow">
      <button class="day-pill active" onclick="filterSubGroup('all',this)">الكل</button>
      <button class="day-pill" onclick="filterSubGroup('big',this)">🔵 الكبار</button>
      <button class="day-pill" onclick="filterSubGroup('mid',this)">🟡 الوسط</button>
      <button class="day-pill" onclick="filterSubGroup('small',this)">🟢 الصغار</button>
    </div>
    <div id="subList"></div>
  </div>
  <div class="sub-page" id="sub-add">
    <div class="section">
      <div class="section-title">➕ تسجيل لاعب جديد</div>
      <div class="form-grid">
        <div class="form-full"><label>اسم اللاعب *</label><input id="sName" placeholder="الاسم الكامل"/></div>
        <div class="form-full"><label>المجموعة</label>
          <select id="sGroup">
            <option value="big">🔵 الكبار</option>
            <option value="mid">🟡 الوسط</option>
            <option value="small">🟢 الصغار</option>
          </select></div>
        <div><label>سنة الميلاد</label><input id="sBirth" type="number" placeholder="2010"/></div>
        <div><label>رقم التيشيرت</label><input id="sJersey" type="number" placeholder="10"/></div>
        <div><label>تاريخ الاشتراك</label><input id="sStart" type="date" oninput="autoSetEndDate()"/></div>
        <div><label>تاريخ الانتهاء (تلقائي)</label><input id="sEnd" type="date"/></div>
      </div>
      <button class="btn btn-green" onclick="addSubPlayer()" style="width:100%;margin-top:0.5rem">تسجيل</button>
    </div>
  </div>
  <div class="sub-page" id="sub-alerts"><div id="alertsList"></div></div>
</div>

<!-- ===== ATTENDANCE ===== -->

<div class="page" id="page-attendance">
  <div class="sub-tabs">
    <button class="sub-tab active" onclick="switchAtt('record',this)">📝 تسجيل</button>
    <button class="sub-tab" onclick="switchAtt('history',this)">📅 السجل</button>
    <button class="sub-tab" onclick="switchAtt('stats',this)">📊 إحصائيات</button>
  </div>
  <div class="sub-page active" id="att-record">
    <div style="display:flex;gap:0.5rem;margin-bottom:0.6rem;align-items:center;">
      <input type="date" id="attDate" style="flex:1" oninput="renderAttList()"/>
      <button class="btn btn-sm btn-green" onclick="setAttToday()">اليوم</button>
    </div>
    <div class="filter-row">
      <button class="day-pill active" onclick="setAttGroup('all',this)">الكل</button>
      <button class="day-pill" onclick="setAttGroup('big',this)">🔵 الكبار</button>
      <button class="day-pill" onclick="setAttGroup('mid',this)">🟡 الوسط</button>
      <button class="day-pill" onclick="setAttGroup('small',this)">🟢 الصغار</button>
    </div>
    <div id="attDaySummary"></div>
    <div id="attList"></div>
    <div class="save-row"><button class="btn btn-gold" onclick="saveAll()">☁️ حفظ الحضور</button></div>
  </div>
  <div class="sub-page" id="att-history">
    <div style="display:flex;gap:0.5rem;margin-bottom:0.75rem;align-items:flex-end;flex-wrap:wrap;">
      <div style="flex:1;min-width:120px;"><label>من</label><input type="date" id="histFrom"/></div>
      <div style="flex:1;min-width:120px;"><label>إلى</label><input type="date" id="histTo"/></div>
      <button class="btn btn-sm btn-green" onclick="renderHistory()">بحث</button>
    </div>
    <div id="historyContent"></div>
  </div>
  <div class="sub-page" id="att-stats">
    <div style="display:flex;gap:0.5rem;margin-bottom:0.7rem;align-items:center;flex-wrap:wrap;">
      <input id="attSearch" placeholder="🔍 بحث..." oninput="renderAttStats()" style="flex:1"/>
      <select id="attMonth" onchange="renderAttStats()" style="width:auto">
        <option value="">كل الوقت</option>
      </select>
    </div>
    <div id="attStats"></div>
  </div>
</div>

<!-- MODAL -->

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <p id="modalMsg" style="display:none"></p>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-btns" id="modalBtns"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getDatabase, ref, set, get } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';
const app = initializeApp({ databaseURL: 'https://academy-skills-default-rtdb.firebaseio.com' });
const db = getDatabase(app);

// ===== CONSTANTS =====
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const CRITERIA=[
  {id:'attendance',label:'✅ الحضور',max:1},
  {id:'effort',label:'💪 الجهد',max:2},
  {id:'instructions',label:'📢 التعليمات',max:2},
  {id:'skill',label:'⚽ المهارة',max:2},
  {id:'teamwork',label:'🤝 التعاون',max:1},
  {id:'spirit',label:'🔥 الروح',max:1},
  {id:'improvement',label:'📈 التحسن',max:1}
];
const BONUS={
  gk:[{id:'saves',label:'تصدٍّ',pts:1},{id:'clean',label:'صفرية',pts:2}],
  def:[{id:'tackle',label:'قطع',pts:1},{id:'block',label:'صد',pts:1}],
  rb:[{id:'tackle',label:'قطع',pts:1},{id:'block',label:'صد',pts:1}],
  lb:[{id:'tackle',label:'قطع',pts:1},{id:'block',label:'صد',pts:1}],
  mid:[{id:'assist',label:'تمريرة حاسمة',pts:1},{id:'recovery',label:'استرجاع',pts:1}],
  fwd:[{id:'goal',label:'هدف',pts:2},{id:'assist',label:'تمريرة',pts:1}],
  rw:[{id:'goal',label:'هدف',pts:2},{id:'assist',label:'تمريرة',pts:1}],
  lw:[{id:'goal',label:'هدف',pts:2},{id:'assist',label:'تمريرة',pts:1}]
};
const POS_LABEL={gk:'حارس',def:'مدافع',rb:'مدافع أيمن',lb:'مدافع أيسر',mid:'وسط',fwd:'مهاجم',rw:'جناح أيمن',lw:'جناح أيسر'};
const POS_EMOJI={gk:'🧤',def:'🛡️',rb:'🛡️',lb:'🛡️',mid:'🔄',fwd:'⚡',rw:'↗️',lw:'↖️'};
const GROUP_LABEL={big:'🔵 الكبار',mid:'🟡 الوسط',small:'🟢 الصغار'};
const SUB_LABEL={active:'✅ فعال',expired:'❌ منتهي',stopped:'⏸ موقوف',expiring:'⚠️ ينتهي قريباً'};
const SUB_CLASS={active:'sub-active',expired:'sub-expired',stopped:'sub-stopped',expiring:'sub-expiring'};

// ===== STATE =====
let state={ratingPlayers:[],weeks:{},subPlayers:[],attendance:{},currentDay:0};
let weekOffset=0, openCard=null, subFilter='all', subGroupFilter='all', ratingGroup='all', attGroup='all';

// ===== HELPERS =====
function getDayName(dateStr){
  const p=dateStr.split('-');
  return DAYS[new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])).getDay()];
}
function setSyncStatus(t,m){
  const el=document.getElementById('syncStatus');
  el.className='sync-status sync-'+t;
  el.innerHTML=m;
}

// ===== FIREBASE =====
async function loadAll(){
  setSyncStatus('loading','جاري التحميل... <span class="spinner"></span>');
  try{
    const snap=await get(ref(db,'academy'));
    if(snap.exists()){
      const d=snap.val();
      if(d.ratingPlayers)state.ratingPlayers=d.ratingPlayers;
      if(d.weeks)state.weeks=d.weeks;
      if(d.subPlayers)state.subPlayers=d.subPlayers;
      if(d.attendance)state.attendance=d.attendance;
      setSyncStatus('ok','✅ متصل بالسحابة');
    } else {
      setSyncStatus('ok','✅ جاهز');
    }
  } catch(e){
    setSyncStatus('err','⚠️ خطأ في الاتصال');
  }
  renderAll();
  populateMonthFilter();
}

async function saveAll(){
  const btn=document.getElementById('saveBtn');
  btn.innerHTML='⏳';btn.disabled=true;
  try{
    await set(ref(db,'academy'),state);
    setSyncStatus('ok','✅ تم الحفظ');
    btn.innerHTML='✅';
    setTimeout(()=>{btn.innerHTML='☁️ حفظ';btn.disabled=false;},2000);
  } catch(e){
    setSyncStatus('err','⚠️ فشل');
    btn.innerHTML='☁️ حفظ';btn.disabled=false;
  }
}
window.saveAll=saveAll;

function renderAll(){
  renderRatingAll();
  renderSubList();
  renderAttList();
  renderAlerts();
}

// ===== NAVIGATION =====
window.switchMain=function(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.main-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  btn.classList.add('active');
  if(id==='subscriptions'){renderSubList();renderAlerts();}
  if(id==='attendance'){renderAttList();}
};
window.switchSub=function(id,btn){
  document.querySelectorAll('#page-subscriptions .sub-page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('#page-subscriptions .sub-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('sub-'+id).classList.add('active');
  btn.classList.add('active');
  if(id==='alerts')renderAlerts();
};
window.switchAtt=function(id,btn){
  document.querySelectorAll('#page-attendance .sub-page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('#page-attendance .sub-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('att-'+id).classList.add('active');
  btn.classList.add('active');
  if(id==='stats'){renderAttStats();populateMonthFilter();}
  if(id==='history')renderHistory();
};
window.switchTab=function(id,btn){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
  if(id==='leaderboard')renderLeaderboard();
  if(id==='rplayers'){renderRPlayersList();refreshPlayerDropdown();}
};

// ===== RATING =====
function getWeekKey(o=0){
  const d=new Date(),day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);
  d.setDate(diff+o*7);
  return d.toISOString().slice(0,10);
}
function currentWeekKey(){return getWeekKey(weekOffset);}
function getWeekRatings(){
  const k=currentWeekKey();
  if(!state.weeks[k])state.weeks[k]={ratings:{}};
  return state.weeks[k].ratings;
}
function getWeekLabel(){
  const d=new Date(currentWeekKey()),e=new Date(d);
  e.setDate(d.getDate()+6);
  return d.toLocaleDateString('en-GB',{month:'short',day:'numeric'})+' — '+e.toLocaleDateString('en-GB',{month:'short',day:'numeric'});
}
window.changeWeek=function(d){weekOffset+=d;openCard=null;renderRatingAll();};
window.setRatingGroup=function(g,btn){
  ratingGroup=g;
  document.querySelectorAll('.group-filter .day-pill').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderPlayerCards();
};
function getScore(pid,day){
  const r=getWeekRatings()[pid]?.[day];
  if(!r)return 0;
  let t=Object.values(r.criteria||{}).reduce((a,b)=>a+b,0);
  const p=state.ratingPlayers.find(x=>x.id===pid);
  if(p)(BONUS[p.pos]||[]).forEach(b=>{t+=(r.bonus?.[b.id]||0)*b.pts;});
  return t;
}
function getTotalScore(pid){return DAYS.reduce((s,_,i)=>s+getScore(pid,i),0);}

function renderRatingAll(){
  document.getElementById('weekLabel').textContent=getWeekLabel();
  const wk=new Date(currentWeekKey());
  const off=[6,0,1,2,3,4,5];
  document.getElementById('dayPills').innerHTML=DAYS.map((d,i)=>{
    const dd=new Date(wk);
    dd.setDate(wk.getDate()+off[i]);
    const ds=dd.toLocaleDateString('en-GB',{day:'numeric',month:'numeric'});
    return`<button class="day-pill ${i===state.currentDay?'active':''}" onclick="selectDay(${i})" id="dp-${i}">${d}<br><span style="font-size:0.65rem;opacity:0.8">${ds}</span></button>`;
  }).join('');
  renderPlayerCards();
  renderLeaderboard();
  renderRPlayersList();
}

window.selectDay=function(i){
  state.currentDay=i;
  openCard=null;
  renderPlayerCards();
  document.querySelectorAll('[id^="dp-"]').forEach((b,idx)=>{
    b.classList.toggle('active',idx===i);
  });
};

function renderPlayerCards(){
  const el=document.getElementById('playerCards');
  let players=state.ratingPlayers;
  if(ratingGroup!=='all')players=players.filter(p=>(p.group||'')===ratingGroup);
  if(!players.length){el.innerHTML='<p class="empty-msg">لا يوجد لاعبون في هذه المجموعة</p>';return;}
  const ratings=getWeekRatings();
  el.innerHTML=players.map(p=>{
    const ds=getScore(p.id,state.currentDay);
    const r=ratings[p.id]?.[state.currentDay]||{criteria:{},bonus:{}};
    const bonuses=BONUS[p.pos]||[];
    const isOpen=openCard===p.id;
    const cHTML=CRITERIA.map(c=>{
      const btns=Array.from({length:c.max+1},(_,v)=>
        `<button class="score-btn ${(r.criteria[c.id]||0)===v?'selected':''}" onclick="setScore('${p.id}','${c.id}',${v});event.stopPropagation()">${v}</button>`
      ).join('');
      return`<div class="criteria-row"><div class="criteria-label">${c.label}(/${c.max})</div><div class="score-btns">${btns}</div></div>`;
    }).join('');
    const bHTML=bonuses.length?`<div class="bonus-section"><div class="bonus-label">⭐ ${POS_LABEL[p.pos]}</div>${bonuses.map(b=>
      `<div class="bonus-row"><div class="bonus-name">${b.label}(+${b.pts})</div><div class="counter-btns">
      <button class="counter-btn" onclick="changeBonus('${p.id}','${b.id}',-1);event.stopPropagation()">−</button>
      <div class="counter-val">${r.bonus?.[b.id]||0}</div>
      <button class="counter-btn" onclick="changeBonus('${p.id}','${b.id}',1);event.stopPropagation()">+</button>
      </div></div>`).join('')}</div>`:'';
    return`<div class="player-card">
      <div class="player-header" onclick="toggleCard('${p.id}')">
        <div class="player-pos pos-${p.pos}">${POS_EMOJI[p.pos]}</div>
        <div class="player-name">${p.name}<br><span style="font-size:0.7rem;color:var(--muted)">${POS_LABEL[p.pos]||''}</span></div>
        <div class="player-total ${ds===0?'zero':''}" id="score-${p.id}">${ds}</div>
        <div class="chevron ${isOpen?'open':''}">▼</div>
      </div>
      <div class="criteria-grid ${isOpen?'open':''}">${cHTML}${bHTML}</div>
    </div>`;
  }).join('');
}

window.toggleCard=function(id){openCard=openCard===id?null:id;renderPlayerCards();};

function ensureRating(pid){
  const wr=getWeekRatings();
  if(!wr[pid])wr[pid]={};
  if(!wr[pid][state.currentDay])wr[pid][state.currentDay]={criteria:{},bonus:{}};
}

window.setScore=function(pid,cid,val){
  ensureRating(pid);
  getWeekRatings()[pid][state.currentDay].criteria[cid]=val;
  const s=getScore(pid,state.currentDay);
  const el=document.getElementById('score-'+pid);
  if(el){el.textContent=s;el.className='player-total'+(s===0?' zero':'');}
  document.querySelectorAll(`[onclick*="setScore('${pid}','${cid}'"]`).forEach(b=>{
    const v=parseInt(b.getAttribute('onclick').match(/,(\d+)\)/)[1]);
    b.className='score-btn'+(val===v?' selected':'');
  });
};

window.changeBonus=function(pid,bid,delta){
  ensureRating(pid);
  const cur=getWeekRatings()[pid][state.currentDay].bonus[bid]||0;
  getWeekRatings()[pid][state.currentDay].bonus[bid]=Math.max(0,cur+delta);
  const prev=openCard;openCard=pid;renderPlayerCards();openCard=prev;
};

function renderLeaderboard(){
  const el=document.getElementById('leaderboardContent');
  if(!state.ratingPlayers.length){el.innerHTML='<p class="empty-msg">لا يوجد لاعبون</p>';return;}
  const ws=state.ratingPlayers.map(p=>({...p,total:getTotalScore(p.id)})).sort((a,b)=>b.total-a.total);
  const overall=renderBoard('🏆 أفضل لاعب',ws);
  const byGroup=['big','mid','small'].map(g=>{
    const f=ws.filter(p=>p.group===g);
    return f.length?renderBoard(GROUP_LABEL[g]+' — الترتيب',f):'';
  }).join('');
  const byPos=['gk','def','rb','lb','mid','fwd','rw','lw'].map(pos=>{
    const f=ws.filter(p=>p.pos===pos);
    return f.length?renderBoard(`${POS_EMOJI[pos]} أفضل ${POS_LABEL[pos]}`,f):'';
  }).join('');
  const ds=DAYS.map((day,di)=>{
    const sc=ws.map(p=>({...p,score:getScore(p.id,di)})).sort((a,b)=>b.score-a.score);
    const t=sc[0];
    if(!t||t.score===0)return`<div class="board-row"><span style="color:var(--muted)">${day}: —</span></div>`;
    return`<div class="board-row"><span style="color:var(--gold)">⭐</span><div class="board-name">${day}</div><div style="font-weight:700">${t.name}</div><div class="board-pts">${t.score}</div></div>`;
  }).join('');
  el.innerHTML=`${overall}${byGroup}${byPos}<div class="board-section"><div class="board-title">⭐ نجوم الأيام</div>${ds}</div>`;
}

function renderBoard(title,players){
  if(!players.length)return'';
  const medals=['🥇','🥈','🥉'];
  const rows=players.slice(0,3).map((p,i)=>
    `<div class="board-row">
      <div class="rank ${['rank-1','rank-2','rank-3'][i]||'rank-n'}">${medals[i]||i+1}</div>
      <div class="player-pos pos-${p.pos}">${POS_EMOJI[p.pos]}</div>
      <div class="board-name">${p.name}</div>
      <div class="board-pts ${i===0?'top':''}">${p.total} نقطة</div>
    </div>`
  ).join('');
  return`<div class="board-section"><div class="board-title">${title}</div>${rows}</div>`;
}

// Rating Players Management
window.refreshPlayerDropdown=function(){
  const grpEl=document.getElementById('rAddGroup');
  const sel=document.getElementById('rSelectPlayer');
  if(!sel)return;
  const group=grpEl?grpEl.value:'all';
  const existing=state.ratingPlayers.map(p=>p.name);
  const avail=state.subPlayers.filter(p=>!existing.includes(p.name)&&(group==='all'||(p.group||'')===group));
  sel.innerHTML='<option value="">-- اختر لاعباً --</option>'+
    avail.map(p=>`<option value="${p.id}">${p.name}${p.group?' ('+GROUP_LABEL[p.group]+')':''}</option>`).join('');
};

window.addFromDropdown=function(){
  const selEl=document.getElementById('rSelectPlayer');
  const pos=document.getElementById('rNewPos').value;
  if(!selEl||!selEl.value){alert('اختر لاعباً من القائمة');return;}
  const sub=state.subPlayers.find(p=>p.id===selEl.value);
  if(!sub)return;
  if(state.ratingPlayers.find(p=>p.name===sub.name)){alert('هذا اللاعب مضاف بالفعل');return;}
  state.ratingPlayers.push({id:Date.now().toString(),name:sub.name,pos,group:sub.group||'big'});
  refreshPlayerDropdown();
  renderRPlayersList();
  renderPlayerCards();
};

function renderRPlayersList(){
  const el=document.getElementById('rPlayersList');
  if(!state.ratingPlayers.length){el.innerHTML='<p class="empty-msg">لا يوجد لاعبون في قائمة التقييم</p>';return;}
  const gc={big:'#2979ff',mid:'#ffd600',small:'#00c853'};
  el.innerHTML=state.ratingPlayers.map(p=>
    `<div class="board-row">
      <div class="player-pos pos-${p.pos}">${POS_EMOJI[p.pos]}</div>
      <div class="board-name">${p.name}<br>
        <span style="font-size:0.7rem;color:${gc[p.group]||'var(--muted)'}">
          ${GROUP_LABEL[p.group]||'لم تُحدد'}
        </span>
      </div>
      <button class="btn btn-blue btn-sm" onclick="editRPlayer('${p.id}')">✏️</button>
      <button class="btn btn-red btn-sm" onclick="removeRPlayer('${p.id}')">🗑️</button>
    </div>`
  ).join('');
}

window.editRPlayer=function(id){
  const p=state.ratingPlayers.find(x=>x.id===id);if(!p)return;
  showModal('✏️ تعديل اللاعب','',`
    <label>الاسم</label><input id="editRName" value="${p.name}"/>
    <label>المجموعة</label>
    <select id="editRGroup">
      <option value="big" ${(p.group||'')==='big'?'selected':''}>🔵 الكبار</option>
      <option value="mid" ${(p.group||'')==='mid'?'selected':''}>🟡 الوسط</option>
      <option value="small" ${(p.group||'')==='small'?'selected':''}>🟢 الصغار</option>
    </select>
    <label>المركز</label>
    <select id="editRPos">
      <option value="fwd" ${p.pos==='fwd'?'selected':''}>⚡ مهاجم</option>
      <option value="rw" ${p.pos==='rw'?'selected':''}>↗️ جناح أيمن</option>
      <option value="lw" ${p.pos==='lw'?'selected':''}>↖️ جناح أيسر</option>
      <option value="mid" ${p.pos==='mid'?'selected':''}>🔄 وسط</option>
      <option value="rb" ${p.pos==='rb'?'selected':''}>🛡️ مدافع أيمن</option>
      <option value="lb" ${p.pos==='lb'?'selected':''}>🛡️ مدافع أيسر</option>
      <option value="def" ${p.pos==='def'?'selected':''}>🛡️ مدافع</option>
      <option value="gk" ${p.pos==='gk'?'selected':''}>🧤 حارس</option>
    </select>
  `,[
    {label:'حفظ',cls:'btn-green',action:()=>{
      p.name=document.getElementById('editRName').value.trim()||p.name;
      p.group=document.getElementById('editRGroup').value;
      p.pos=document.getElementById('editRPos').value;
      renderRPlayersList();renderPlayerCards();closeModal();
    }},
    {label:'إلغاء',cls:'btn btn-blue btn-sm',action:closeModal}
  ]);
};

window.removeRPlayer=function(id){
  showModal('حذف لاعب','هل تريد حذف هذا اللاعب من قائمة التقييم؟','',[
    {label:'حذف',cls:'btn-red',action:()=>{
      state.ratingPlayers=state.ratingPlayers.filter(p=>p.id!==id);
      Object.values(state.weeks).forEach(w=>{if(w.ratings)delete w.ratings[id];});
      renderRPlayersList();renderPlayerCards();closeModal();
    }},
    {label:'إلغاء',cls:'btn btn-blue btn-sm',action:closeModal}
  ]);
};

window.confirmResetWeek=function(){
  showModal('تأكيد','حذف تقييمات الأسبوع الحالي؟','',[
    {label:'حذف',cls:'btn-red',action:()=>{delete state.weeks[currentWeekKey()];closeModal();renderRatingAll();}},
    {label:'إلغاء',cls:'btn btn-blue btn-sm',action:closeModal}
  ]);
};

// ===== SUBSCRIPTIONS =====
window.autoSetEndDate=function(){
  const start=document.getElementById('sStart').value;
  if(!start)return;
  const d=new Date(start);d.setMonth(d.getMonth()+1);
  document.getElementById('sEnd').value=d.toISOString().slice(0,10);
};

function getSubStatus(p){
  if(p.stopped)return 'stopped';
  if(!p.endDate)return 'active';
  const diff=(new Date(p.endDate)-new Date())/(1000*60*60*24);
  if(diff<0)return 'expired';
  if(diff<=10)return 'expiring';
  return 'active';
}

window.filterSub=function(f){subFilter=f;renderSubList();};
window.filterSubGroup=function(g,btn){
  subGroupFilter=g;
  document.querySelectorAll('#subGroupFilterRow .day-pill').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderSubList();
};

window.renderSubList=function(){
  const el=document.getElementById('subList');
  const search=(document.getElementById('subSearch').value||'').toLowerCase();
  let players=[...state.subPlayers];
  if(search)players=players.filter(p=>p.name.toLowerCase().includes(search));
  if(subFilter!=='all')players=players.filter(p=>{
    const s=getSubStatus(p);
    return s===subFilter||(subFilter==='active'&&s==='expiring');
  });
  if(subGroupFilter!=='all')players=players.filter(p=>(p.group||'')===subGroupFilter);
  if(!players.length){el.innerHTML='<p class="empty-msg">لا يوجد لاعبون</p>';return;}
  el.innerHTML=players.map(p=>{
    const status=getSubStatus(p);
    return`<div class="player-sub-card">
      <div class="player-sub-header" onclick="toggleSubCard('${p.id}')">
        <div class="jersey">${p.jersey||'—'}</div>
        <div class="player-sub-name">${p.name}<br>
          <span style="font-size:0.7rem;color:var(--muted)">
            ${p.birthYear?'م'+p.birthYear:''}
            ${p.group?' • '+GROUP_LABEL[p.group]:''}
          </span>
        </div>
        <span class="sub-badge ${SUB_CLASS[status]}">${SUB_LABEL[status]}</span>
        <div class="chevron" id="chevron-${p.id}">▼</div>
      </div>
      <div class="player-sub-body" id="subbody-${p.id}">
        <div class="info-row"><span class="info-label">بداية الاشتراك</span><span class="info-val">${p.startDate||'—'}</span></div>
        <div class="info-row"><span class="info-label">نهاية الاشتراك</span>
          <span class="info-val" style="color:${status==='expired'?'var(--red)':status==='expiring'?'var(--gold)':'var(--text)'}">
            ${p.endDate||'—'}
          </span>
        </div>
        ${p.stopDate?`<div class="info-row"><span class="info-label">تاريخ الإيقاف</span><span class="info-val" style="color:#ff6d00">${p.stopDate}</span></div>`:''}
        ${p.resumeDate?`<div class="info-row"><span class="info-label">تاريخ الاستكمال</span><span class="info-val" style="color:var(--green)">${p.resumeDate}</span></div>`:''}
        ${(p.compDaysTotal&&p.compDaysTotal>0)?`<div class="info-row"><span class="info-label">➕ أيام تعويض مضافة</span><span class="info-val" style="color:#ce93d8">+${p.compDaysTotal} يوم</span></div>`:''}
        <div class="sub-actions">
          <button class="btn btn-green btn-sm" onclick="renewSub('${p.id}')">🔄 تجديد</button>
          ${p.stopped?
            `<button class="btn btn-sm" style="background:#00c85322;color:var(--green);border:1px solid #00c85344" onclick="showResumeSub('${p.id}')">▶️ استكمال</button>`:
            `<button class="btn btn-orange btn-sm" onclick="showStopSub('${p.id}')">⏸ إيقاف</button>`
          }
          <button class="btn btn-purple btn-sm" onclick="addCompDays('${p.id}')">➕ تعويض</button>
          <button class="btn btn-blue btn-sm" onclick="editSubPlayer('${p.id}')">✏️ تعديل</button>
          <button class="btn btn-red btn-sm" onclick="deleteSubPlayer('${p.id}')">🗑️</button>
        </div>
      </div>
    </div>`;
  }).join('');
};

window.toggleSubCard=function(id){
  const body=document.getElementById('subbody-'+id);
  const chev=document.getElementById('chevron-'+id);
  body.classList.toggle('open');
  chev.classList.toggle('open');
};

window.addSubPlayer=function(){
  const name=document.getElementById('sName').value.trim();
  if(!name)return;
  const p={
    id:Date.now().toString(),name,
    group:document.getElementById('sGroup').value,
    birthYear:document.getElementById('sBirth').value,
    jersey:document.getElementById('sJersey').value,
    startDate:document.getElementById('sStart').value,
    endDate:document.getElementById('sEnd').value,
    stopped:false
  };
  state.subPlayers.push(p);
  ['sName','sBirth','sJersey','sStart','sEnd'].forEach(id=>document.getElementById(id).value='');
  showModal('✅ تم','تم تسجيل اللاعب بنجاح','',[{label:'حسناً',cls:'btn-green',action:closeModal}]);
  renderSubList();
};

window.renewSub=function(id){
  const p=state.subPlayers.find(x=>x.id===id);if(!p)return;
  showModal('🔄 تجديد الاشتراك','',`
    <label>تاريخ الانتهاء الجديد</label>
    <input type="date" id="renewDate" value="${p.endDate||''}"/>
  `,[
    {label:'تجديد',cls:'btn-green',action:()=>{
      const v=document.getElementById('renewDate').value;
      if(v){p.endDate=v;p.stopped=false;}
      renderSubList();closeModal();
    }},
    {label:'إلغاء',cls:'btn btn-blue btn-sm',action:closeModal}
  ]);
};

window.showStopSub=function(id){
  const p=state.subPlayers.find(x=>x.id===id);if(!p)return;
  const today=new Date().toISOString().slice(0,10);
  showModal('⏸ إيقاف الاشتراك','',`
    <label>تاريخ الإيقاف</label>
    <input type="date" id="stopDate" value="${today}"/>
  `,[
    {label:'إيقاف',cls:'btn-orange',action:()=>{
      const stopDate=document.getElementById('stopDate').value;
      if(stopDate){p.stopped=true;p.stopDate=stopDate;}
      renderSubList();closeModal();
    }},
    {label:'إلغاء',cls:'btn btn-blue btn-sm',action:closeModal}
  ]);
};

window.showResumeSub=function(id){
  const p=state.subPlayers.find(x=>x.id===id);if(!p)return;
  const today=new Date().toISOString().slice(0,10);
  let autoNewEnd='';
  if(p.stopDate&&p.endDate){
    const pauseDays=Math.ceil((new Date(today)-new Date(p.stopDate))/(1000*60*60*24));
    const oldEnd=new Date(p.endDate);
    oldEnd.setDate(oldEnd.getDate()+pauseDays);
    autoNewEnd=oldEnd.toISOString().slice(0,10);
  }
  showModal('▶️ استكمال الاشتراك','',`
    <label>تاريخ الاستكمال</label>
    <input type="date" id="resumeDate" value="${today}" oninput="recalcResume('${p.stopDate||''}','${p.endDate||''}')"/>
    <label>تاريخ الانتهاء الجديد (يُحسب تلقائياً)</label>
    <input type="date" id="newEndDate" value="${autoNewEnd||p.endDate||''}" style="color:var(--gold)"/>
    <div style="font-size:0.73rem;color:var(--muted);margin-top:0.3rem">⚡ يضاف وقت الإيقاف تلقائياً</div>
  `,[
    {label:'استكمال',cls:'btn-green',action:()=>{
      const resumeDate=document.getElementById('resumeDate').value;
      const newEnd=document.getElementById('newEndDate').value;
      if(resumeDate){
        p.stopped=false;p.resumeDate=resumeDate;
        if(newEnd)p.endDate=newEnd;
      }
      renderSubList();closeModal();
    }},
    {label:'إلغاء',cls:'btn btn-blue btn-sm',action:closeModal}
  ]);
};
window.recalcResume=function(stopDate,oldEnd){
  const resumeVal=document.getElementById('resumeDate').value;
  if(stopDate&&oldEnd&&resumeVal){
    const pauseDays=Math.ceil((new Date(resumeVal)-new Date(stopDate))/(1000*60*60*24));
    const endD=new Date(oldEnd);
    endD.setDate(endD.getDate()+pauseDays);
    document.getElementById('newEndDate').value=endD.toISOString().slice(0,10);
  }
};

window.addCompDays=function(id){
  const p=state.subPlayers.find(x=>x.id===id);if(!p)return;
  showModal('➕ أيام تعويضية','',`
    <label>العملية</label>
    <select id="compAction" style="margin-bottom:0.5rem">
      <option value="add">➕ إضافة أيام تعويضية</option>
      <option value="remove">➖ إلغاء أيام تعويضية</option>
    </select>
    <label>عدد الأيام</label>
    <input type="number" id="compDays" value="1" min="1" max="365" style="margin-bottom:0.5rem"/>
    <label>تاريخ الانتهاء الحالي</label>
    <input type="date" value="${p.endDate||''}" disabled style="opacity:0.6;margin-bottom:0.35rem"/>
    <div style="font-size:0.73rem;color:#ce93d8">إجمالي أيام التعويض: ${p.compDaysTotal||0} يوم</div>
  `,[
    {label:'تأكيد',cls:'btn-green',action:()=>{
      const days=parseInt(document.getElementById('compDays').value)||0;
      const action=document.getElementById('compAction').value;
      if(days>0&&p.endDate){
        const d=new Date(p.endDate);
        if(action==='add'){
          d.setDate(d.getDate()+days);
          p.compDaysTotal=(p.compDaysTotal||0)+days;
        } else {
          d.setDate(d.getDate()-days);
          p.compDaysTotal=Math.max(0,(p.compDaysTotal||0)-days);
        }
        p.endDate=d.toISOString().slice(0,10);
      }
      renderSubList();closeModal();
    }},
    {label:'إلغاء',cls:'btn btn-blue btn-sm',action:closeModal}
  ]);
};

window.editSubPlayer=function(id){
  const p=state.subPlayers.find(x=>x.id===id);if(!p)return;
  showModal('✏️ تعديل بيانات اللاعب','',`
    <label>الاسم</label><input id="editSName" value="${p.name}"/>
    <label>المجموعة</label>
    <select id="editSGroup">
      <option value="big" ${(p.group||'')==='big'?'selected':''}>🔵 الكبار</option>
      <option value="mid" ${(p.group||'')==='mid'?'selected':''}>🟡 الوسط</option>
      <option value="small" ${(p.group||'')==='small'?'selected':''}>🟢 الصغار</option>
    </select>
    <label>سنة الميلاد</label><input id="editSBirth" value="${p.birthYear||''}" type="number"/>
    <label>رقم التيشيرت</label><input id="editSJersey" value="${p.jersey||''}" type="number"/>
    <label>تاريخ الاشتراك</label>
    <input id="editSStart" type="date" value="${p.startDate||''}" oninput="autoEditEnd()"/>
    <label>تاريخ الانتهاء</label>
    <input id="editSEnd" type="date" value="${p.endDate||''}"/>
  `,[
    {label:'حفظ',cls:'btn-green',action:()=>{
      p.name=document.getElementById('editSName').value.trim()||p.name;
      p.group=document.getElementById('editSGroup').value;
      p.birthYear=document.getElementById('editSBirth').value;
      p.jersey=document.getElementById('editSJersey').value;
      p.startDate=document.getElementById('editSStart').value;
      p.endDate=document.getElementById('editSEnd').value;
      renderSubList();closeModal();
    }},
    {label:'إلغاء',cls:'btn btn-blue btn-sm',action:closeModal}
  ]);
};
window.autoEditEnd=function(){
  const s=document.getElementById('editSStart').value;
  if(!s)return;
  const d=new Date(s);d.setMonth(d.getMonth()+1);
  document.getElementById('editSEnd').value=d.toISOString().slice(0,10);
};

window.deleteSubPlayer=function(id){
  showModal('حذف','هل تريد حذف هذا اللاعب نهائياً؟','',[
    {label:'حذف',cls:'btn-red',action:()=>{
      state.subPlayers=state.subPlayers.filter(p=>p.id!==id);
      renderSubList();closeModal();
    }},
    {label:'إلغاء',cls:'btn btn-blue btn-sm',action:closeModal}
  ]);
};

function renderAlerts(){
  const el=document.getElementById('alertsList');
  const now=new Date();
  const expiring=state.subPlayers.filter(p=>{
    if(p.stopped||!p.endDate)return false;
    const diff=(new Date(p.endDate)-now)/(1000*60*60*24);
    return diff>=0&&diff<=10;
  });
  const expired=state.subPlayers.filter(p=>{
    if(p.stopped||!p.endDate)return false;
    return new Date(p.endDate)<now;
  });
  let html='';
  if(expiring.length)html+=`<div class="section"><div class="section-title" style="color:var(--gold)">⚠️ تنتهي خلال 10 أيام (${expiring.length})</div>${expiring.map(p=>`<div class="board-row"><div class="jersey">${p.jersey||'—'}</div><div class="board-name">${p.name}</div><span style="color:var(--gold);font-size:0.78rem">${p.endDate}</span></div>`).join('')}</div>`;
  if(expired.length)html+=`<div class="section"><div class="section-title" style="color:var(--red)">❌ منتهية (${expired.length})</div>${expired.map(p=>`<div class="board-row"><div class="jersey">${p.jersey||'—'}</div><div class="board-name">${p.name}</div><span style="color:var(--red);font-size:0.78rem">${p.endDate}</span></div>`).join('')}</div>`;
  if(!html)html='<p class="empty-msg">✅ لا توجد تنبيهات</p>';
  el.innerHTML=html;
}

// ===== ATTENDANCE =====
function getAllPlayers(){
  const all=[...state.ratingPlayers];
  state.subPlayers.forEach(p=>{if(!all.find(r=>r.name===p.name))all.push({...p});});
  return all;
}

window.setAttToday=function(){
  document.getElementById('attDate').value=new Date().toISOString().slice(0,10);
  renderAttList();
};
window.setAttGroup=function(g,btn){
  attGroup=g;
  document.querySelectorAll('#att-record .filter-row .day-pill').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderAttList();
};

window.renderAttList=function(){
  const el=document.getElementById('attList');
  const sumEl=document.getElementById('attDaySummary');
  const date=document.getElementById('attDate').value;
  if(!date){el.innerHTML='<p class="empty-msg">اختر تاريخاً أولاً</p>';sumEl.innerHTML='';return;}
  let allPlayers=getAllPlayers();
  if(attGroup!=='all')allPlayers=allPlayers.filter(p=>(p.group||'')===attGroup);
  if(!allPlayers.length){el.innerHTML='<p class="empty-msg">لا يوجد لاعبون</p>';return;}
  if(!state.attendance[date])state.attendance[date]={};
  const present=allPlayers.filter(p=>state.attendance[date][p.id]==='present').length;
  const absent=allPlayers.filter(p=>state.attendance[date][p.id]==='absent').length;
  sumEl.innerHTML=`<div style="display:flex;gap:0.5rem;margin-bottom:0.5rem">
    <div style="flex:1;background:#00c85322;border:1px solid #00c85344;border-radius:8px;padding:0.5rem;text-align:center">
      <div style="font-size:1.3rem;font-weight:900;color:var(--green)">${present}</div>
      <div style="font-size:0.72rem;color:var(--muted)">حاضر</div>
    </div>
    <div style="flex:1;background:#ff174422;border:1px solid #ff174433;border-radius:8px;padding:0.5rem;text-align:center">
      <div style="font-size:1.3rem;font-weight:900;color:var(--red)">${absent}</div>
      <div style="font-size:0.72rem;color:var(--muted)">غائب</div>
    </div>
    <div style="flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0.5rem;text-align:center">
      <div style="font-size:1.3rem;font-weight:900;color:var(--gold)">${allPlayers.length-present-absent}</div>
      <div style="font-size:0.72rem;color:var(--muted)">لم يُسجَّل</div>
    </div>
  </div>
  <div style="font-size:0.78rem;color:var(--muted);text-align:center;margin-bottom:0.5rem">${getDayName(date)} — ${date}</div>`;
  el.innerHTML=allPlayers.map(p=>{
    const att=state.attendance[date][p.id]||'';
    return`<div class="att-row">
      <div class="att-name">${p.name}</div>
      <div class="att-btns">
        <button class="att-btn ${att==='present'?'present':''}" onclick="setAtt('${date}','${p.id}','present')">✅</button>
        <button class="att-btn ${att==='absent'?'absent':''}" onclick="setAtt('${date}','${p.id}','absent')">❌</button>
      </div>
    </div>`;
  }).join('');
};

window.setAtt=function(date,pid,val){
  if(!state.attendance[date])state.attendance[date]={};
  state.attendance[date][pid]=state.attendance[date][pid]===val?'':val;
  renderAttList();
};

function renderHistory(){
  const el=document.getElementById('historyContent');
  const from=document.getElementById('histFrom').value;
  const to=document.getElementById('histTo').value;
  const dates=Object.keys(state.attendance).filter(d=>(!from||d>=from)&&(!to||d<=to)).sort().reverse();
  if(!dates.length){el.innerHTML='<p class="empty-msg">لا توجد بيانات في هذه الفترة</p>';return;}
  const allP=getAllPlayers();
  el.innerHTML=dates.map(date=>{
    const att=state.attendance[date]||{};
    const present=allP.filter(p=>att[p.id]==='present');
    const absent=allP.filter(p=>att[p.id]==='absent');
    return`<div class="section" style="margin-bottom:0.65rem">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem">
        <div style="font-weight:800;font-size:0.88rem">${getDayName(date)} — ${date}</div>
        <div style="display:flex;gap:0.35rem;align-items:center">
          <span style="color:var(--green);font-size:0.8rem;font-weight:700">✅${present.length}</span>
          <span style="color:var(--red);font-size:0.8rem;font-weight:700">❌${absent.length}</span>
          <button class="btn btn-red btn-sm" onclick="deleteAttDay('${date}')">🗑️</button>
        </div>
      </div>
      ${present.length?`<div style="font-size:0.78rem;color:var(--green);margin-bottom:0.25rem"><strong>الحضور:</strong> ${present.map(p=>p.name).join('، ')}</div>`:''}
      ${absent.length?`<div style="font-size:0.78rem;color:var(--red)"><strong>الغياب:</strong> ${absent.map(p=>p.name).join('، ')}</div>`:''}
    </div>`;
  }).join('');
}

window.deleteAttDay=function(date){
  showModal('🗑️ حذف سجل',`حذف سجل يوم ${date}؟`,'',[
    {label:'حذف',cls:'btn-red',action:()=>{delete state.attendance[date];renderHistory();closeModal();}},
    {label:'إلغاء',cls:'btn btn-blue btn-sm',action:closeModal}
  ]);
};

function populateMonthFilter(){
  const sel=document.getElementById('attMonth');
  const months=[...new Set(Object.keys(state.attendance).map(d=>d.slice(0,7)))].sort().reverse();
  sel.innerHTML='<option value="">كل الوقت</option>'+months.map(m=>`<option value="${m}">${m}</option>`).join('');
}

window.renderAttStats=function(){
  const el=document.getElementById('attStats');
  const search=(document.getElementById('attSearch').value||'').toLowerCase();
  const month=document.getElementById('attMonth').value;
  let players=getAllPlayers();
  if(search)players=players.filter(p=>p.name.toLowerCase().includes(search));
  const dates=Object.keys(state.attendance).filter(d=>!month||d.startsWith(month));
  const totalDays=dates.length;
  if(!players.length){el.innerHTML='<p class="empty-msg">لا يوجد لاعبون</p>';return;}
  const ws=players.map(p=>{
    let present=0,absent=0;
    dates.forEach(d=>{
      if(state.attendance[d]?.[p.id]==='present')present++;
      else if(state.attendance[d]?.[p.id]==='absent')absent++;
    });
    return{...p,present,absent,pct:totalDays?Math.round(present/totalDays*100):0};
  }).sort((a,b)=>b.pct-a.pct);
  const avg=ws.length?Math.round(ws.reduce((s,p)=>s+p.pct,0)/ws.length):0;
  el.innerHTML=`<div class="stats-grid">
    <div class="stat-card"><div class="stat-num">${totalDays}</div><div style="font-size:0.7rem;color:var(--muted)">أيام تدريب</div></div>
    <div class="stat-card"><div class="stat-num gold">${avg}%</div><div style="font-size:0.7rem;color:var(--muted)">متوسط الحضور</div></div>
    <div class="stat-card"><div class="stat-num">${players.length}</div><div style="font-size:0.7rem;color:var(--muted)">لاعب</div></div>
  </div>`+ws.map(p=>{
    const c=p.pct>=80?'var(--green)':p.pct>=50?'var(--gold)':'var(--red)';
    return`<div class="att-summary-row">
      <div style="flex:1">
        <div style="font-weight:700;font-size:0.85rem;margin-bottom:0.3rem">${p.name}</div>
        <div style="background:var(--card2);border-radius:4px;height:6px;overflow:hidden">
          <div style="width:${p.pct}%;height:100%;background:${c};border-radius:4px"></div>
        </div>
      </div>
      <div style="text-align:center;min-width:40px">
        <div style="font-weight:900;color:${c};font-size:0.9rem">${p.pct}%</div>
        <div style="font-size:0.68rem;color:var(--muted)">${p.present}✅ ${p.absent}❌</div>
      </div>
    </div>`;
  }).join('');
};

// ===== MODAL =====
window.showModal=function(title,msg,bodyHTML,btns){
  document.getElementById('modalTitle').textContent=title;
  const msgEl=document.getElementById('modalMsg');
  if(msg){msgEl.style.display='block';msgEl.textContent=msg;}else{msgEl.style.display='none';}
  document.getElementById('modalBody').innerHTML=bodyHTML||'';
  document.getElementById('modalBtns').innerHTML=btns.map((b,i)=>
    `<button class="btn ${b.cls}" onclick="modalAction(${i})">${b.label}</button>`
  ).join('');
  document.getElementById('modalOverlay').classList.add('open');
  window._modalActions=btns.map(b=>b.action);
};
window.modalAction=function(i){window._modalActions[i]();};
window.closeModal=function(){document.getElementById('modalOverlay').classList.remove('open');};

// ===== INIT =====
document.getElementById('attDate').value=new Date().toISOString().slice(0,10);
loadAll();
</script>
